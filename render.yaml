services:
  - type: web
    name: arbmusic
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: SMS_RU_API_ID
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: arbmusic-db
          property: connectionString
databases:
  - name: arbmusic-db
    plan: free
    databaseName: arbmusic
    user: arbmusic
